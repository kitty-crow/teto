name: CI
on:
  push:
    branches: [main, refactor/source-only-teto]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Regenerate and prove WAT reproduces production binaries
        run: bash scripts/regenerate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: teto-generated-source
          path: |
            src/
            abi/
            teto.manifest.json
            SHA256SUMS
          if-no-files-found: error
      - name: Commit initial generated source to the conversion branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/source-only-teto'
        run: |
          git add -A -- src abi teto.manifest.json SHA256SUMS
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: regenerate Teto WAT from pinned toolchain'
            git push origin HEAD:refs/heads/refactor/source-only-teto
          fi
      - name: Check generated source is committed and no binaries are tracked
        run: |
          git add -A -- src abi teto.manifest.json SHA256SUMS
          git diff --cached --exit-code
          test -z "$(git ls-files -- dist '*.wasm' '*.o' '*.a' '*.so' '*.img' '*.elf' '*.bin')"
  compile:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Compile committed WAT without Thistle, Bake or Baguette
        run: bash scripts/build.sh
