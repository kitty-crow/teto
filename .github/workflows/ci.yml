name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check canonical Thistle source and Teto production provenance
        env:
          # Build the merged canonical Thistle kernel from main.
          THISTLE_REF: main
        run: npm test
      - name: Verify immutable Thistle SHA fetch and exact generated source
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA="$(cat build/thistle-source.sha)"
          THISTLE_REF="$SHA" bash scripts/ci/fetch-thistle-source.sh
          [[ "$(cat build/thistle-source.sha)" == "$SHA" ]]
          node scripts/ci/stage-thistle-native.mjs --check
      - name: Require successful canonical Thistle native-kernel validation
        env:
          THISTLE_REF: main
        run: |
          if [ ! -f build/thistle-source.sha ]; then bash scripts/ci/fetch-thistle-source.sh; fi
          bun scripts/ci/probe-thistle-kernel.ts

