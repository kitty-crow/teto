name: CI
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Regenerate and prove WAT reproduces production binaries
        run: bash scripts/regenerate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: teto-generated-source
          path: |
            src/
            abi/
            teto.manifest.json
            SHA256SUMS
          if-no-files-found: error
      - name: Check generated source is committed and no binaries are tracked
        run: |
          git add -A -- src abi teto.manifest.json SHA256SUMS
          git diff --cached --exit-code
          test -z "$(git ls-files -- dist '*.wasm' '*.o' '*.a' '*.so' '*.img' '*.elf' '*.bin')"
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Compile committed WAT without Thistle, Bake or Baguette
        run: bash scripts/build.sh
