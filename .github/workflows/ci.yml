name: Kernel source and build validation
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: Transpile source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Transpile source from pinned toolchain
        run: bash scripts/regenerate.sh
      - name: Upload generated source
        uses: actions/upload-artifact@v6
        with:
          name: teto-generated-source
          path: |
            src/
            abi/
            teto.manifest.json
            SHA256SUMS
          if-no-files-found: error
  compile:
    name: Compile
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove old generated source
        run: rm -rf src abi
      - name: Download generated source
        uses: actions/download-artifact@v7
        with:
          name: teto-generated-source
          path: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Verify generated source
        run: sha256sum -c SHA256SUMS
      - name: Compile freshly generated source
        run: bash scripts/build.sh
      - name: Verify committed source matches regeneration
        run: |
          git add -A -- src abi teto.manifest.json SHA256SUMS
          git diff --cached --exit-code
          test -z "$(git ls-files -- dist '*.wasm' '*.o' '*.a' '*.so' '*.img' '*.elf' '*.bin')"
