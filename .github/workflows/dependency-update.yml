name: Regenerate for dependency update
on:
  repository_dispatch:
    types: [upstream-updated, dependency-updated]
  workflow_dispatch:
    inputs:
      dependency:
        description: Thistle or Baguette
        required: true
      revision:
        description: Exact commit
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: dependency-${{ github.event.client_payload.dependency || inputs.dependency }}
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Select pinned revision
        env:
          DEPENDENCY: ${{ github.event.client_payload.dependency || inputs.dependency }}
          REVISION: ${{ github.event.client_payload.new_commit || inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          case "$DEPENDENCY" in
            Thistle|Baguette) ;;
            *) exit 2 ;;
          esac
          bash scripts/ci/update-dependency.sh "$DEPENDENCY" "$REVISION"
          git add -- "${DEPENDENCY,,}" project.dependencies.json
          git submodule update --init --recursive
          bash scripts/regenerate.sh
      - name: Open an approval-only source update
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY: ${{ github.event.client_payload.dependency || inputs.dependency }}
          REVISION: ${{ github.event.client_payload.new_commit || inputs.revision }}
        run: bash scripts/ci/open-dependency-pr.sh "$DEPENDENCY" "$REVISION"
