name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          printf 'tag=%s\narchive=teto-%s-wasm.tar.gz\n' "$tag" "$tag" >> "$GITHUB_OUTPUT"
      - name: Install Dependencies
        run: bun install --no-save
      - name: Build and Verify WASM
        run: bun run --bun build
      - name: Package WASM
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          test -s dist/teto/teto.wasm
          test -s dist/teto/teto-threads.wasm
          mkdir -p release
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner \
            -czf "release/$ARCHIVE" \
            LICENSE dist/teto/teto.wasm dist/teto/teto-threads.wasm \
            dist/teto/teto.manifest.json dist/teto/host-interface.d.ts
          tar -tzf "release/$ARCHIVE"
      - name: Generate Checksums
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          cd release
          sha256sum "$ARCHIVE" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload Release Artefact
        uses: actions/upload-artifact@v6
        with:
          name: teto-wasm
          path: |
            release/${{ steps.version.outputs.archive }}
            release/SHA256SUMS
          if-no-files-found: error
  publish:
    name: Publish Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Artefact
        uses: actions/download-artifact@v7
        with:
          name: teto-wasm
          path: release
      - name: Verify Checksums
        run: cd release && sha256sum -c SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          gh release create "$TAG" "release/$ARCHIVE" release/SHA256SUMS \
            --verify-tag --generate-notes --title "Teto $TAG"
