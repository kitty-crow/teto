name: Verify canonical Thistle upstream revision

on:
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact upstream commit to test
        required: true

permissions:
  contents: read

concurrency:
  group: upstream-thistle
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require an exact upstream source revision
        env:
          THISTLE_REF: ${{ github.event.client_payload.new_commit || inputs.revision }}
        run: |
          [[ "$THISTLE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a 40-character Thistle revision SHA' >&2; exit 2; }
          echo "THISTLE_REF=$THISTLE_REF" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build and verify only the selected canonical Thistle revision
        run: npm test
